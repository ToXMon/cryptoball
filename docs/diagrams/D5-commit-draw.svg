<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 798" width="1500" height="798"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="context-stroke"/></marker></defs><rect width="1500" height="798" fill="#FFFFFF"/><text x="30" y="40" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#0B1220">D5 — commit_draw: Open → DrawCommitted</text><text x="30" y="64" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#5B6577">Owner: commit_draw. One commit per campaign; there is no re-commit instruction (no re-roll).</text><rect x="20.0" y="100" width="200" height="46" rx="9" fill="#F8FAFC" stroke="#334155" stroke-width="1.7"/><text x="120.0" y="120" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">Keeper</text><text x="120.0" y="136" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5B6577" text-anchor="middle">anyone</text><line x1="120.0" y1="146" x2="120.0" y2="708" stroke="#C9D1DE" stroke-width="1.6" stroke-dasharray="3 5"/><rect x="335.0" y="100" width="200" height="46" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.7"/><text x="435.0" y="120" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">Switchboard SDK</text><text x="435.0" y="136" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5B6577" text-anchor="middle">off-chain</text><line x1="435.0" y1="146" x2="435.0" y2="708" stroke="#C9D1DE" stroke-width="1.6" stroke-dasharray="3 5"/><rect x="650.0" y="100" width="200" height="46" rx="9" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.7"/><text x="750.0" y="120" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">cryptoball</text><text x="750.0" y="136" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5B6577" text-anchor="middle">commit_draw</text><line x1="750.0" y1="146" x2="750.0" y2="708" stroke="#C9D1DE" stroke-width="1.6" stroke-dasharray="3 5"/><rect x="965.0" y="100" width="200" height="46" rx="9" fill="#FFFBEB" stroke="#B45309" stroke-width="1.7"/><text x="1065.0" y="120" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">Switchboard program</text><text x="1065.0" y="136" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5B6577" text-anchor="middle">pinned id</text><line x1="1065.0" y1="146" x2="1065.0" y2="708" stroke="#C9D1DE" stroke-width="1.6" stroke-dasharray="3 5"/><rect x="1280.0" y="100" width="200" height="46" rx="9" fill="#F8FAFC" stroke="#334155" stroke-width="1.7"/><text x="1380.0" y="120" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">Oracle (TEE)</text><text x="1380.0" y="136" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5B6577" text-anchor="middle">3rd party</text><line x1="1380.0" y1="146" x2="1380.0" y2="708" stroke="#C9D1DE" stroke-width="1.6" stroke-dasharray="3 5"/><rect x="134.0" y="168" width="578.4" height="44" rx="7" fill="#F8FAFC" stroke="#0B1220" stroke-width="1.3"/><text x="146.0" y="185" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#0B1220" text-anchor="start">Wait until now &gt;= close_ts (sales are closed, so nobody can buy after seeing the result)</text><circle cx="120.0" cy="187" r="10" fill="#0B1220"/><text x="120.0" y="191" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="146.0" y="202" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="600" fill="#0B1220" text-anchor="start">R-37</text><path d="M120.0 256 L433.0 256" stroke="#64748B" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ah)"/><rect x="119.5" y="232" width="316.0" height="17" rx="4" fill="#fff" fill-opacity=".95"/><text x="277.5" y="245" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0B1220" text-anchor="middle">Randomness.create(queue) -&gt; new randomness keypair</text><circle cx="120.0" cy="256" r="10" fill="#64748B"/><text x="120.0" y="260" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">2</text><path d="M120.0 322 L748.0 322" stroke="#0B1220" stroke-width="1.8" marker-end="url(#ah)"/><rect x="238.0" y="298" width="394.0" height="17" rx="4" fill="#fff" fill-opacity=".95"/><text x="435.0" y="311" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0B1220" text-anchor="middle">ONE tx: [Switchboard commitIx, commit_draw(randomness_account)]</text><text x="435.0" y="336" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="600" fill="#0B1220" text-anchor="middle">R-75</text><circle cx="120.0" cy="322" r="10" fill="#0B1220"/><text x="120.0" y="326" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">3</text><path d="M750.0 388 L1063.0 388" stroke="#7C3AED" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ah)"/><rect x="734.5" y="364" width="346.0" height="17" rx="4" fill="#fff" fill-opacity=".95"/><text x="907.5" y="377" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0B1220" text-anchor="middle">commitIx binds seed_slot to the previous slot (same tx)</text><text x="907.5" y="402" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="600" fill="#7C3AED" text-anchor="middle">R-40</text><circle cx="750.0" cy="388" r="10" fill="#7C3AED"/><text x="750.0" y="392" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="764.0" y="432" width="628.8" height="44" rx="7" fill="#F8FAFC" stroke="#0B1220" stroke-width="1.3"/><text x="776.0" y="449" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#0B1220" text-anchor="start">Guards: now &gt;= close_ts · count &gt; 0 · owner == pinned SB id · seed_slot == slot-1 · not revealed</text><circle cx="750.0" cy="451" r="10" fill="#0B1220"/><text x="750.0" y="455" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="776.0" y="466" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="600" fill="#0B1220" text-anchor="start">R-37 R-38 R-39 R-40</text><rect x="764.0" y="498" width="483.9" height="44" rx="7" fill="#F8FAFC" stroke="#0B1220" stroke-width="1.3"/><text x="776.0" y="515" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#0B1220" text-anchor="start">store rand_account, seed_slot, committed_at · state Open -&gt; DrawCommitted</text><circle cx="750.0" cy="517" r="10" fill="#0B1220"/><text x="750.0" y="521" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="776.0" y="532" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="600" fill="#0B1220" text-anchor="start">R-41 R-42</text><path d="M1065.0 586 L1378.0 586" stroke="#64748B" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ah)"/><rect x="1043.5" y="562" width="358.0" height="17" rx="4" fill="#fff" fill-opacity=".95"/><text x="1222.5" y="575" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0B1220" text-anchor="middle">Oracle sees the commit, derives randomness inside its TEE</text><circle cx="1065.0" cy="586" r="10" fill="#64748B"/><text x="1065.0" y="590" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">7</text><path d="M1380.0 652 L1067.0 652" stroke="#64748B" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ah)"/><rect x="1067.5" y="628" width="310.0" height="17" rx="4" fill="#fff" fill-opacity=".95"/><text x="1222.5" y="641" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0B1220" text-anchor="middle">Reveal becomes available (checked only at settle)</text><text x="1222.5" y="666" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="600" fill="#64748B" text-anchor="middle">R-45</text><circle cx="1380.0" cy="652" r="10" fill="#64748B"/><text x="1380.0" y="656" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">8</text><rect x="30" y="716" width="1440" height="56" rx="9" fill="#FFFBEB" stroke="#B45309" stroke-width="1.3"/><text x="46" y="738" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#0B1220" text-anchor="start">Residual risk (accepted for MVP, documented): the committer can see the revealed value off-chain and decline to settle. Settle is permissionless and cancel_campaign refunds everyone</text><text x="46" y="754" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#0B1220" text-anchor="start">after REVEAL_TIMEOUT, so aborting costs a draw but gains nothing; there is no re-commit path. Switchboard guidance: take collateral at commit time (here: at purchase).</text></svg>