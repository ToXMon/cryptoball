<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 864" width="1500" height="864"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="context-stroke"/></marker></defs><rect width="1500" height="864" fill="#FFFFFF"/><text x="30" y="40" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#0B1220">D6 — settle_draw: DrawCommitted → Settled with automatic payout</text><text x="30" y="64" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#5B6577">Owner: settle_draw. Nobody claims; the winner signs nothing; the caller chooses no destination.</text><rect x="20.0" y="100" width="200" height="46" rx="9" fill="#F8FAFC" stroke="#334155" stroke-width="1.7"/><text x="120.0" y="120" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">Keeper / anyone</text><text x="120.0" y="136" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5B6577" text-anchor="middle">fee payer</text><line x1="120.0" y1="146" x2="120.0" y2="774" stroke="#C9D1DE" stroke-width="1.6" stroke-dasharray="3 5"/><rect x="272.0" y="100" width="200" height="46" rx="9" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.7"/><text x="372.0" y="120" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">cryptoball</text><text x="372.0" y="136" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5B6577" text-anchor="middle">settle_draw</text><line x1="372.0" y1="146" x2="372.0" y2="774" stroke="#C9D1DE" stroke-width="1.6" stroke-dasharray="3 5"/><rect x="524.0" y="100" width="200" height="46" rx="9" fill="#FFFBEB" stroke="#B45309" stroke-width="1.7"/><text x="624.0" y="120" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">Switchboard program</text><text x="624.0" y="136" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5B6577" text-anchor="middle">reveal / get_value</text><line x1="624.0" y1="146" x2="624.0" y2="774" stroke="#C9D1DE" stroke-width="1.6" stroke-dasharray="3 5"/><rect x="776.0" y="100" width="200" height="46" rx="9" fill="#FFFBEB" stroke="#B45309" stroke-width="1.7"/><text x="876.0" y="120" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">System program</text><text x="876.0" y="136" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5B6577" text-anchor="middle"></text><line x1="876.0" y1="146" x2="876.0" y2="774" stroke="#C9D1DE" stroke-width="1.6" stroke-dasharray="3 5"/><rect x="1028.0" y="100" width="200" height="46" rx="9" fill="#FFFBEB" stroke="#B45309" stroke-width="1.7"/><text x="1128.0" y="120" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">Treasury wallet</text><text x="1128.0" y="136" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5B6577" text-anchor="middle">Config.treasury</text><line x1="1128.0" y1="146" x2="1128.0" y2="774" stroke="#C9D1DE" stroke-width="1.6" stroke-dasharray="3 5"/><rect x="1280.0" y="100" width="200" height="46" rx="9" fill="#FFFBEB" stroke="#B45309" stroke-width="1.7"/><text x="1380.0" y="120" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">Winner wallet</text><text x="1380.0" y="136" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5B6577" text-anchor="middle">Ticket.buyer</text><line x1="1380.0" y1="146" x2="1380.0" y2="774" stroke="#C9D1DE" stroke-width="1.6" stroke-dasharray="3 5"/><path d="M120.0 190 L370.0 190" stroke="#0B1220" stroke-width="1.8" marker-end="url(#ah)"/><rect x="25.0" y="166" width="442.0" height="17" rx="4" fill="#fff" fill-opacity=".95"/><text x="246.0" y="179" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0B1220" text-anchor="middle">ONE tx: [Switchboard revealIx, settle_draw(randomness, winning Ticket)]</text><text x="246.0" y="204" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="600" fill="#0B1220" text-anchor="middle">R-85 R-43</text><circle cx="120.0" cy="190" r="10" fill="#0B1220"/><text x="120.0" y="194" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">1</text><path d="M120.0 256 L622.0 256" stroke="#7C3AED" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ah)"/><rect x="178.0" y="232" width="388.0" height="17" rx="4" fill="#fff" fill-opacity=".95"/><text x="372.0" y="245" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0B1220" text-anchor="middle">revealIx writes the revealed value into the randomness account</text><text x="372.0" y="270" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="600" fill="#7C3AED" text-anchor="middle">R-45</text><circle cx="120.0" cy="256" r="10" fill="#7C3AED"/><text x="120.0" y="260" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="386.0" y="300" width="446.09999999999997" height="44" rx="7" fill="#F8FAFC" stroke="#0B1220" stroke-width="1.3"/><text x="398.0" y="317" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#0B1220" text-anchor="start">Guard: state == DrawCommitted · key == stored · seed_slot == stored</text><circle cx="372.0" cy="319" r="10" fill="#0B1220"/><text x="372.0" y="323" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="398.0" y="334" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="600" fill="#0B1220" text-anchor="start">R-43 R-44</text><path d="M372.0 388 L622.0 388" stroke="#0B1220" stroke-width="1.8" marker-end="url(#ah)"/><rect x="277.0" y="364" width="442.0" height="17" rx="4" fill="#fff" fill-opacity=".95"/><text x="498.0" y="377" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0B1220" text-anchor="middle">get_value(clock.slot) -&gt; 32 bytes, or error if unrevealed -&gt; tx reverts</text><text x="498.0" y="402" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="600" fill="#0B1220" text-anchor="middle">R-45 R-78</text><circle cx="372.0" cy="388" r="10" fill="#0B1220"/><text x="372.0" y="392" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="386.0" y="432" width="603.6" height="44" rx="7" fill="#F8FAFC" stroke="#0B1220" stroke-width="1.3"/><text x="398.0" y="449" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#0B1220" text-anchor="start">winning_index = u128(value[0..16]) mod ticket_count · Ticket must equal PDA(campaign, index)</text><circle cx="372.0" cy="451" r="10" fill="#0B1220"/><text x="372.0" y="455" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="398.0" y="466" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="600" fill="#0B1220" text-anchor="start">R-46 R-47</text><rect x="386.0" y="498" width="477.59999999999997" height="44" rx="7" fill="#F8FAFC" stroke="#0B1220" stroke-width="1.3"/><text x="398.0" y="515" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#0B1220" text-anchor="start">fee = pool × fee_bps / 10_000 (floor, u128 checked) · prize = pool − fee</text><circle cx="372.0" cy="517" r="10" fill="#0B1220"/><text x="372.0" y="521" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="398.0" y="532" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="600" fill="#0B1220" text-anchor="start">R-48 R-71</text><path d="M372.0 586 L1126.0 586" stroke="#0B1220" stroke-width="1.8" marker-end="url(#ah)"/><rect x="514.0" y="562" width="472.0" height="17" rx="4" fill="#fff" fill-opacity=".95"/><text x="750.0" y="575" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0B1220" text-anchor="middle">CPI system transfer Vault -&gt; Treasury wallet (fee) · signer: vault PDA seeds</text><text x="750.0" y="600" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="600" fill="#0B1220" text-anchor="middle">R-49</text><circle cx="372.0" cy="586" r="10" fill="#0B1220"/><text x="372.0" y="590" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">7</text><path d="M372.0 652 L1378.0 652" stroke="#0B1220" stroke-width="1.8" marker-end="url(#ah)"/><rect x="610.0" y="628" width="532.0" height="17" rx="4" fill="#fff" fill-opacity=".95"/><text x="876.0" y="641" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0B1220" text-anchor="middle">CPI system transfer Vault -&gt; Ticket.buyer wallet (prize) · destination from the Ticket</text><text x="876.0" y="666" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="600" fill="#0B1220" text-anchor="middle">R-50</text><circle cx="372.0" cy="652" r="10" fill="#0B1220"/><text x="372.0" y="656" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">8</text><rect x="386.0" y="696" width="565.8" height="44" rx="7" fill="#F8FAFC" stroke="#0B1220" stroke-width="1.3"/><text x="398.0" y="713" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#0B1220" text-anchor="start">store value, winning_index, winner · state DrawCommitted -&gt; Settled · emit DrawSettled</text><circle cx="372.0" cy="715" r="10" fill="#0B1220"/><text x="372.0" y="719" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">9</text><text x="398.0" y="730" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="600" fill="#0B1220" text-anchor="start">R-52 R-53 R-54</text><rect x="30" y="782" width="1440" height="56" rx="9" fill="#FFFBEB" stroke="#B45309" stroke-width="1.3"/><text x="46" y="804" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#0B1220" text-anchor="start">Modulo bias: reducing a uniform 128-bit value mod N (N &lt;= 2^32) biases by at most N/2^128 (~1e-29): negligible, no rejection loop needed. The winner rule is the swappable unit</text><text x="46" y="820" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#0B1220" text-anchor="start">Upgrade path: under the captain-decided raffle rule exactly one ticket wins, so one tx pays everything. Exact-match tiers need a tally pass and per-winner payouts: a different instruction set.</text></svg>