<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" width="1600" height="820"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="context-stroke"/></marker></defs><rect width="1600" height="820" fill="#FFFFFF"/><text x="30" y="40" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#0B1220">D3 — Campaign and Ticket state machines</text><text x="30" y="64" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#5B6577">Every arrow names its single owning instruction and guard. Settled and Cancelled are absorbing. Pause is a Config flag, not a state.</text><circle cx="70" cy="290" r="9" fill="#0B1220"/><rect x="200" y="250" width="190" height="80" rx="40.0" fill="#fff" stroke="#B91C1C" stroke-width="2.2"/><text x="295.0" y="288.0" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#0B1220" text-anchor="middle">Open</text><text x="295.0" y="306.0" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5B6577" text-anchor="middle">sales until close_ts</text><rect x="620" y="250" width="230" height="80" rx="40.0" fill="#fff" stroke="#B91C1C" stroke-width="2.2"/><text x="735.0" y="288.0" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#0B1220" text-anchor="middle">DrawCommitted</text><text x="735.0" y="306.0" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5B6577" text-anchor="middle">randomness bound</text><rect x="1100" y="250" width="190" height="80" rx="40.0" fill="#fff" stroke="#B91C1C" stroke-width="2.2"/><rect x="1105" y="255" width="180" height="70" rx="35.0" fill="none" stroke="#B91C1C" stroke-width="1.2"/><text x="1195.0" y="288.0" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#0B1220" text-anchor="middle">Settled</text><text x="1195.0" y="306.0" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5B6577" text-anchor="middle">prize paid · terminal</text><rect x="620" y="520" width="230" height="80" rx="40.0" fill="#fff" stroke="#B91C1C" stroke-width="2.2"/><rect x="625" y="525" width="220" height="70" rx="35.0" fill="none" stroke="#B91C1C" stroke-width="1.2"/><text x="735.0" y="558.0" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#0B1220" text-anchor="middle">Cancelled</text><text x="735.0" y="576.0" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5B6577" text-anchor="middle">refunds only · terminal</text><path d="M70,290 L200,290" fill="none" stroke="#1D4ED8" stroke-width="1.8" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="84.0" y="265" width="94.0" height="16" rx="4" fill="#fff" fill-opacity=".92"/><text x="135" y="277" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">create_campaign</text><text x="135" y="314" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">R-13..R-19 R-77</text><path d="M390,290 L620,290" fill="none" stroke="#1D4ED8" stroke-width="1.8" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="465.2" y="265" width="71.6" height="16" rx="4" fill="#fff" fill-opacity=".92"/><text x="505" y="277" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">commit_draw</text><text x="505" y="306" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#5B6577" text-anchor="middle">now &gt;= close_ts · count &gt; 0</text><text x="505" y="320" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#5B6577" text-anchor="middle">SB owner · fresh seed_slot</text><text x="505" y="334" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">R-37..R-42</text><path d="M850,290 L1100,290" fill="none" stroke="#1D4ED8" stroke-width="1.8" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="935.2" y="265" width="71.6" height="16" rx="4" fill="#fff" fill-opacity=".92"/><text x="975" y="277" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">settle_draw</text><text x="975" y="306" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#5B6577" text-anchor="middle">key + seed match · revealed</text><text x="975" y="320" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#5B6577" text-anchor="middle">Ticket PDA = derived index</text><text x="975" y="334" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#5B6577" text-anchor="middle">fee -&gt; treasury · rest -&gt; winner</text><text x="975" y="348" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">R-43..R-54 R-78</text><path d="M295,330 L295,560 L620,560" fill="none" stroke="#B91C1C" stroke-width="1.8" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="244.0" y="439" width="94.0" height="16" rx="4" fill="#fff" fill-opacity=".92"/><text x="295" y="451" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#B91C1C" text-anchor="middle">cancel_campaign</text><text x="305" y="472" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#5B6577" text-anchor="start">now &gt;= close_ts · count = 0 · R-55</text><path d="M735,330 L735,520" fill="none" stroke="#B91C1C" stroke-width="1.8" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="684.0" y="414" width="94.0" height="16" rx="4" fill="#fff" fill-opacity=".92"/><text x="735" y="426" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#B91C1C" text-anchor="middle">cancel_campaign</text><text x="745" y="447" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#5B6577" text-anchor="start">now &gt; committed_at + REVEAL_TIMEOUT · R-56</text><path d="M260,250 L260,205 L330,205 L330,250" fill="none" stroke="#1D4ED8" stroke-width="1.8" marker-end="url(#ah)" stroke-linejoin="round"/><text x="295" y="190" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">buy_ticket  (count += 1)  R-21..R-34</text><path d="M690,600 L690,650 L780,650 L780,600" fill="none" stroke="#B91C1C" stroke-width="1.8" marker-end="url(#ah)" stroke-linejoin="round"/><text x="735" y="668" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="middle">refund_ticket (per Ticket)</text><text x="30" y="110" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#5B6577" text-anchor="start">CAMPAIGN</text><text x="900" y="520" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#5B6577" text-anchor="start">TICKET</text><rect x="900" y="540" width="170" height="64" rx="32.0" fill="#fff" stroke="#B91C1C" stroke-width="2.2"/><text x="985.0" y="570.0" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#0B1220" text-anchor="middle">Active</text><text x="985.0" y="588.0" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5B6577" text-anchor="middle">buy_ticket creates</text><rect x="1180" y="540" width="200" height="64" rx="32.0" fill="#fff" stroke="#B91C1C" stroke-width="2.2"/><rect x="1185" y="545" width="190" height="54" rx="27.0" fill="none" stroke="#B91C1C" stroke-width="1.2"/><text x="1280.0" y="570.0" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#0B1220" text-anchor="middle">Refunded</text><text x="1280.0" y="588.0" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5B6577" text-anchor="middle">terminal</text><path d="M1070,572 L1180,572" fill="none" stroke="#B91C1C" stroke-width="1.8" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="1079.6" y="547" width="82.8" height="16" rx="4" fill="#fff" fill-opacity=".92"/><text x="1125" y="559" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#B91C1C" text-anchor="middle">refund_ticket</text><text x="900" y="640" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#5B6577" text-anchor="start">refund: Campaign = Cancelled · Ticket.buyer wallet · once</text><text x="900" y="654" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="600" fill="#B91C1C" text-anchor="start">R-58 R-59 R-79</text><text x="30" y="740" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#0B1220" text-anchor="start">A Settled campaign&#x27;s tickets stay Active: only the one winner is paid (raffle rule). Config.paused blocks buy_ticket only;</text><text x="30" y="758" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#0B1220" text-anchor="start">commit, settle, cancel and refund always work, so funds are never trapped (R-24, R-87).</text></svg>